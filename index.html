<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7e848e">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Time Chess</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: rgba(16, 20, 30, 0.82);
    --ink: #d7dce6;
    --dim: #8791a3;
    --accent: #e8c15a;
    --white-chip: #f0f0f0;
    --black-chip: #262b36;
    --danger: #e06c5f;
    --ok: #7fc97f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }

  /* The main bar sits along the bottom so stereo modes get the full width */
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--panel); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: flex-start; gap: 14px;
    padding: 10px 14px;
  }
  #identity { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  h1 { font-size: 17px; margin: 0; letter-spacing: 0.5px; }
  h1 small { display: none; }

  #turnline { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #sidechip { display: inline-block; padding: 2px 12px; border-radius: 999px; font-weight: 600; }
  #sidechip.w { background: var(--white-chip); color: #111; }
  #sidechip.b { background: var(--black-chip); color: #eee; border: 1px solid #555; }
  #turnnum { color: var(--dim); }

  #status { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex-shrink: 0;
    max-width: 230px; }
  #banner { display: none; padding: 6px 12px; border-radius: 8px; font-weight: 600;
    background: rgba(232,193,90,0.15); border: 1px solid rgba(232,193,90,0.4); color: var(--accent); }
  #banner.show { display: block; }

  #controls { display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; flex-shrink: 0; }
  #controls .slider { display: inline-flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 7px; padding: 6px 10px; font-size: 12px; color: var(--dim); }
  #controls .slider input { width: 74px; accent-color: var(--accent); margin: 0; }
  button, .mode, select {
    background: rgba(255,255,255,0.06); color: var(--ink);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 7px;
    padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button:hover, select:hover { background: rgba(255,255,255,0.12); }
  select option { background: #1a1f2b; color: var(--ink); }
  button:disabled { opacity: 0.55; cursor: default; }
  .mode.active { background: rgba(232,193,90,0.2); border-color: var(--accent); color: var(--accent); }

  /* The log rides in the bar showing the last event or two; the arrow
     button floats it upward as its own panel for the full history */
  #logwrap { flex: 1; position: relative; min-width: 220px; height: 88px; } /* ~3 events */
  #log { overflow-y: auto; display: flex; flex-direction: column;
    gap: 3px; font-size: 12.5px; padding-right: 30px; height: 100%;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.25) transparent; }
  #logwrap.tall #log {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 45vh; height: 45dvh;
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px 10px 0 0;
    padding: 8px 30px 8px 8px;
  }
  #logexpand { position: absolute; top: 0; right: 0; z-index: 1; padding: 2px 7px;
    font-size: 11px; line-height: 1.4; color: var(--dim); }
  #logwrap.tall #logexpand { top: auto; bottom: calc(45vh - 27px); bottom: calc(45dvh - 27px); }
  body.log-tall #help, body.log-tall #helpbtn { visibility: hidden; }
  #log .entry { padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.035); }
  #log .entry .t { color: var(--dim); margin-right: 6px; }
  #log .check, #log .checkmate, #log .gameOver { border-left: 3px solid var(--accent); }
  #log .lostInTime, #log .neverHappened, #log .steamroller { border-left: 3px solid #9a7fd1; }
  #log .capture, #log .pastCapture { border-left: 3px solid var(--danger); }
  #log .illegal { border-left: 3px solid var(--danger); color: var(--danger); }
  #log .arrival { border-left: 3px solid var(--ok); }

  #hover { position: fixed; right: 14px; top: 12px; padding: 5px 11px; border-radius: 7px;
    background: var(--panel); border: 1px solid rgba(255,255,255,0.1);
    color: var(--ink); font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .12s; }
  #hover.show { opacity: 1; }

  /* The controls cheat-sheet fades to a small "?" shortly after load */
  #help, #helpbtn { position: fixed; right: 14px;
    bottom: calc(var(--bar-h, 70px) + 12px); }
  #help { text-align: right;
    color: var(--ink); font-size: 12px; pointer-events: none;
    background: rgba(8, 10, 16, 0.95); padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.18);
    transition: opacity .4s; }
  #help.hidden { opacity: 0; }
  #help b { color: #fff; font-weight: 600; }
  #helpbtn { width: 30px; height: 30px; border-radius: 50%; padding: 0;
    font-size: 15px; font-weight: 600; color: var(--ink);
    background: rgba(8, 10, 16, 0.9); border-color: rgba(255,255,255,0.3);
    opacity: 0; pointer-events: none; transition: opacity .4s; }
  #helpbtn.show { opacity: 1; pointer-events: auto; }

  #queue { font-size: 12.5px; color: var(--dim); }
  #queue span { color: var(--ink); }

  /* The how-to-play guide overlay */
  #guide {
    position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center; padding: 18px;
    background: rgba(4, 6, 10, 0.6); backdrop-filter: blur(3px);
  }
  #guide[hidden] { display: none; }
  #guide-card {
    background: #12161f; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px; max-width: 600px; width: 100%;
    max-height: 88vh; max-height: 88dvh; overflow-y: auto;
    padding: 22px 24px; position: relative; line-height: 1.55;
  }
  #guide-card h2 { margin: 0 0 4px; font-size: 19px; }
  #guide-card h3 { margin: 18px 0 4px; font-size: 14.5px; color: var(--accent); }
  #guide-card p, #guide-card ul { margin: 6px 0; color: var(--ink); font-size: 13.5px; }
  #guide-card ul { padding-left: 20px; }
  #guide-card li { margin: 3px 0; }
  #guide-card .dim { color: var(--dim); }
  #guide-content h2 + p { color: var(--dim); } /* the subtitle line under the title */
  #guide-card kbd {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, monospace;
  }
  #guide-close {
    position: sticky; float: right; top: 0; margin: -6px -8px 0 12px;
    font-size: 20px; line-height: 1; padding: 4px 9px;
  }
  #guide-start { display: block; margin: 18px auto 2px; padding: 9px 22px;
    background: rgba(232,193,90,0.18); border-color: var(--accent); color: var(--accent);
    font-weight: 600; }

  /* Narrow screens: drop the title and let the controls wrap */
  @media (max-width: 900px) {
    #identity h1 { display: none; }
    #status { display: none; } /* check/queue also land in the log */
    #logwrap { min-width: 140px; }
    #panel { gap: 10px; padding: 8px 10px; }
    #controls { flex-shrink: 1; } /* wrap sooner rather than overflow the bar */
  }

  /* Phones: the bar's sections don't fit side by side; stack them */
  @media (max-width: 720px) {
    #panel { flex-direction: column; align-items: stretch; gap: 8px; }
    #controls { max-width: none; }
    /* fixed-height scroll box: flex-basis and min-height 0, or the item's
       min-content (every log entry) re-inflates it as the game goes on */
    #logwrap { min-width: 0; flex: 0 0 62px; height: 62px; min-height: 0; } /* ~2 events */
  }

  /* Touch: bigger targets, and no hover readout (taps would pin it) */
  @media (pointer: coarse) {
    button, .mode, select { padding: 9px 12px; }
    #hover { display: none; }
    #help, #helpbtn { display: none; } /* the help describes mouse controls */
  }
</style>
</head>
<body>
<div id="scene"></div>

<div id="panel">
  <div id="identity">
    <h1 title="chess, extruded into the time dimension &mdash; 2026 re-implementation of the 2011 original">Time Chess</h1>
    <div id="turnline">
      <span id="sidechip" class="w">White</span>
      <span>to move</span>
      <span id="turnnum">turn 0</span>
    </div>
  </div>
  <div id="controls">
    <button id="newgame" title="Start a new game">New game</button>
    <button id="undo" title="Take back the last move">Undo</button>
    <button id="aimove" title="Let the AI choose and play one move for the side to move (key: c)">AI move</button>
    <select id="opponent" title="Who the AI plays for; it replies automatically on its turn">
      <option value="b" selected>AI plays Black</option>
      <option value="w">AI plays White</option>
      <option value="both">AI vs AI</option>
      <option value="none">Two players</option>
    </select>
    <select id="ailevel" title="AI thinking time per move">
      <option value="500">Fast &middot; &frac12;s</option>
      <option value="1500" selected>Normal &middot; 1&frac12;s</option>
      <option value="4000">Strong &middot; 4s</option>
    </select>
    <button class="mode" data-mode="recent" title="Show the present and the last few turns (key: r)">Recent</button>
    <button class="mode" data-mode="now" title="Show only the present turn (key: n)">Now</button>
    <button class="mode active" data-mode="all" title="Show every turn since the start (key: a)">All</button>
    <label class="slider" title="Opacity of the board surfaces">Board
      <input type="range" id="boardopacity" min="0" max="100" value="10">
    </label>
    <button id="stereo" title="Stereo 3D: press to cycle anaglyph (red/blue glasses) and cross-eye side-by-side (key: s)">Stereo</button>
    <button id="guidebtn" title="How to play (key: h)">Guide</button>
  </div>
  <div id="status">
    <div id="banner"></div>
    <div id="queue"></div>
  </div>
  <div id="logwrap">
    <div id="log"></div>
    <button id="logexpand" title="Expand the event log">&#9650;</button>
  </div>
</div>

<div id="guide" hidden>
  <div id="guide-card">
    <button id="guide-close" title="Close (Esc)">&times;</button>
    <!-- filled from GUIDE.md — edit that file to change the guide -->
    <div id="guide-content"><p class="dim">Loading guide&hellip;</p></div>
    <button id="guide-start">Play</button>
  </div>
</div>

<div id="hover"></div>
<div id="help">
  <b>drag</b> orbit &nbsp; <b>wheel</b> zoom &nbsp; <b>right-drag</b> pan<br>
  <b>click</b> a piece in the top layer, then click a highlighted square<br>
  green = move &nbsp; red = capture &nbsp; each layer of the stack is one turn; time runs upward
</div>
<button id="helpbtn" title="Controls">?</button>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module" src="./src/ui.js"></script>
</body>
</html>
